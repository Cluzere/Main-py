name: Staging credential and API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required secrets are present
        env:
          DISCORD_TOKEN: ${{ secrets.STAGING_DISCORD_BOT_TOKEN }}
          XINGCHI_API_KEY: ${{ secrets.STAGING_XINGCHI_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          missing = [name for name in ("DISCORD_TOKEN", "XINGCHI_API_KEY") if not os.getenv(name)]
          if missing:
              print("MISSING_SECRET_NAMES=" + ",".join(missing))
              sys.exit(1)
          print("REQUIRED_SECRETS_PRESENT")
          PY

      - name: Test Discord bot authentication
        env:
          DISCORD_TOKEN: ${{ secrets.STAGING_DISCORD_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          req = urllib.request.Request(
              "https://discord.com/api/v10/users/@me",
              headers={"Authorization": "Bot " + os.environ["DISCORD_TOKEN"],
                       "User-Agent": "Main-py-staging-smoke-test"}
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.loads(response.read(65536))
                  if response.status != 200 or not data.get("id") or not data.get("bot"):
                      print("DISCORD_AUTH_FAILED: unexpected response")
                      sys.exit(1)
                  print("DISCORD_AUTH_OK")
          except urllib.error.HTTPError as exc:
              print(f"DISCORD_AUTH_FAILED: HTTP {exc.code}")
              sys.exit(1)
          except Exception as exc:
              print("DISCORD_AUTH_FAILED: " + type(exc).__name__)
              sys.exit(1)
          PY

      - name: Test Xingchi chat API
        env:
          XINGCHI_API_KEY: ${{ secrets.STAGING_XINGCHI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          payload = json.dumps({
              "model": "gpt-6.1-sol",
              "messages": [{"role": "user", "content": "Reply with exactly: STAGING_OK"}],
              "max_tokens": 12,
              "temperature": 0
          }).encode()
          req = urllib.request.Request(
              "https://api.xingchiapi.com/v1/chat/completions",
              data=payload,
              headers={"Authorization": "Bearer " + os.environ["XINGCHI_API_KEY"],
                       "Content-Type": "application/json",
                       "User-Agent": "Main-py-staging-smoke-test"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = json.loads(response.read(262144))
                  choices = data.get("choices")
                  if response.status != 200 or not isinstance(choices, list) or not choices:
                      print("XINGCHI_CHAT_FAILED: unexpected response")
                      sys.exit(1)
                  print("XINGCHI_CHAT_OK")
          except urllib.error.HTTPError as exc:
              print(f"XINGCHI_CHAT_FAILED: HTTP {exc.code}")
              sys.exit(1)
          except Exception as exc:
              print("XINGCHI_CHAT_FAILED: " + type(exc).__name__)
              sys.exit(1)
          PY
