name: Staging credential and API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required secrets are present
        env:
          DISCORD_TOKEN: ${{ secrets.STAGING_DISCORD_BOT_TOKEN }}
          XINGCHI_API_KEY: ${{ secrets.STAGING_XINGCHI_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          missing = [name for name in ("DISCORD_TOKEN", "XINGCHI_API_KEY") if not os.getenv(name)]
          if missing:
              print("MISSING_SECRET_NAMES=" + ",".join(missing))
              sys.exit(1)
          print("REQUIRED_SECRETS_PRESENT")
          PY

      - name: Test Discord bot authentication
        env:
          DISCORD_TOKEN: ${{ secrets.STAGING_DISCORD_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          req = urllib.request.Request(
              "https://discord.com/api/v10/users/@me",
              headers={"Authorization": "Bot " + os.environ["DISCORD_TOKEN"],
                       "User-Agent": "Main-py-staging-smoke-test"}
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.loads(response.read(65536))
                  if response.status != 200 or not data.get("id") or not data.get("bot"):
                      print("DISCORD_AUTH_FAILED: unexpected response")
                      sys.exit(1)
                  print("DISCORD_AUTH_OK")
          except urllib.error.HTTPError as exc:
              print(f"DISCORD_AUTH_FAILED: HTTP {exc.code}")
              sys.exit(1)
          except Exception as exc:
              print("DISCORD_AUTH_FAILED: " + type(exc).__name__)
              sys.exit(1)
          PY

      - name: Test Xingchi Responses API
        env:
          XINGCHI_API_KEY: ${{ secrets.STAGING_XINGCHI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error, re
          payload = json.dumps({
              "model": "gpt-6.1-sol",
              "input": "Reply with exactly: STAGING_OK",
              "max_output_tokens": 16,
              "stream": False
          }).encode()
          req = urllib.request.Request(
              "https://api.xingchiapi.com/v1/responses",
              data=payload,
              headers={"Authorization": "Bearer " + os.environ["XINGCHI_API_KEY"],
                       "Content-Type": "application/json",
                       "User-Agent": "opencode/1.0.0",
                       "X-Client-Name": "OpenCode"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = json.loads(response.read(262144))
                  if response.status != 200 or not isinstance(data, dict):
                      print("XINGCHI_RESPONSES_FAILED: unexpected response")
                      sys.exit(1)
                  print("XINGCHI_RESPONSES_OK")
          except urllib.error.HTTPError as exc:
              body = exc.read(8192).decode("utf-8", "replace")
              body = re.sub(r"(?i)(bearer\\s+)[^\\s\\\",]+", r"\\1[REDACTED]", body)
              body = re.sub(r"(?i)(api[_-]?key|token|authorization)(\\s*[=:]\\s*)[^\\s\\\",}]+", r"\\1\\2[REDACTED]", body)
              print(f"XINGCHI_RESPONSES_FAILED: HTTP {exc.code}")
              print("PROVIDER_ERROR_BODY=" + body[:2000])
              sys.exit(1)
          except Exception as exc:
              print("XINGCHI_RESPONSES_FAILED: " + type(exc).__name__)
              sys.exit(1)
          PY
