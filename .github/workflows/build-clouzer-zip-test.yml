name: Build Clouzer ZIP Test Pack

on:
  push:
    branches:
      - clouzer-format-test-pack-2026-11-25
    paths:
      - "tools/build_clouzer_zip_test.py"
      - ".github/workflows/build-clouzer-zip-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx openpyxl python-pptx Pillow reportlab
      - name: Generate ZIP test pack
        run: python tools/build_clouzer_zip_test.py
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clouzer_Paket_Tes_ZIP
          path: dist/Clouzer_Paket_Tes_ZIP.zip
          if-no-files-found: error
          retention-days: 14
