name: CLOUZER multi-format file audit

on:
  push:
    branches:
      - audit-recovery-gpt-2026-11-23
    paths:
      - "audit-recovery/review-round-2/revisi_audit_final_main.py"
      - "audit-recovery/review-round-2/clouzer_file_creation.py"
      - "audit-recovery/review-round-2/test_*.py"
      - "tests/test_audit_candidate_*.py"
      - ".github/workflows/*.yml"
  pull_request:
    branches:
      - ci-validation-base-2026-11-28
    paths:
      - "audit-recovery/review-round-2/revisi_audit_final_main.py"
      - "audit-recovery/review-round-2/clouzer_file_creation.py"
      - "audit-recovery/review-round-2/test_*.py"
      - "tests/test_audit_candidate_*.py"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-syntax-and-file-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile candidate files
        run: |
          python -m py_compile \
            audit-recovery/review-round-2/revisi_audit_final_main.py \
            audit-recovery/review-round-2/clouzer_file_creation.py

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit

      - name: Run high-severity security scan
        run: |
          bandit -q -r \
            audit-recovery/review-round-2/revisi_audit_final_main.py \
            audit-recovery/review-round-2/clouzer_file_creation.py -lll

      - name: Install candidate runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            discord.py aiohttp pillow python-dotenv 'PyMuPDF<2' \
            python-docx python-pptx openpyxl 'py7zr>=1.0,<2' defusedxml

      - name: Run complete candidate regression suite
        run: |
          python -m unittest discover \
            -s audit-recovery/review-round-2 -p "test_*.py" -v
