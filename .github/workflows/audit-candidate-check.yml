name: Audit candidate syntax check

on:
  push:
    branches:
      - audit-recovery-gpt-2026-11-23
    paths:
      - "audit-recovery/review-round-2/revisi_audit_final_main.py"
      - ".github/workflows/audit-candidate-check.yml"
      - "tests/test_audit_candidate_*.py"
      - "audit-recovery/review-round-2/test_*.py"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install discord.py aiohttp pillow python-dotenv pymupdf python-docx python-pptx openpyxl py7zr
      - name: Compile candidate without running the bot
        run: python -m py_compile audit-recovery/review-round-2/revisi_audit_final_main.py
      - name: Install Bandit security scanner
        run: python -m pip install --disable-pip-version-check bandit
      - name: Run high-severity security scan
        run: bandit -q -r audit-recovery/review-round-2/revisi_audit_final_main.py -lll
      - name: Run candidate archive regression tests
        run: python -m unittest discover -s tests -p "test_audit_candidate_*.py" -v
      - name: Run existing audit regression tests when present
        run: |
          if [ -d audit-recovery/review-round-2 ] && ls audit-recovery/review-round-2/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s audit-recovery/review-round-2 -p "test_*.py" -v
          else
            echo "No prior round-2 test modules found; focused candidate tests remain mandatory."
          fi
