name: Audit candidate syntax check

on:
  push:
    branches:
      - audit-recovery-gpt-2026-11-23
      - audit-7z-diagnostics-fix
    paths:
      - "audit-recovery/review-round-2/revisi_audit_final_main.py"
      - "audit-recovery/review-round-2/clouzer_workload.py"
      - "audit-recovery/review-round-2/test_*.py"
      - "audit-recovery/review-round-2/clouzer_file_creation.py"
      - ".github/workflows/audit-candidate-check.yml"
      - "tests/test_audit_candidate_*.py"
      - "audit-recovery/review-round-2/test_*.py"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install discord.py aiohttp pillow python-dotenv 'PyMuPDF<2' python-docx python-pptx openpyxl 'py7zr>=1.0,<2' defusedxml
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile candidate without running the bot
        run: python -m py_compile audit-recovery/review-round-2/revisi_audit_final_main.py audit-recovery/review-round-2/clouzer_file_creation.py audit-recovery/review-round-2/clouzer_workload.py
      - name: Install Bandit security scanner
        run: python -m pip install --disable-pip-version-check bandit
      - name: Install dependency vulnerability scanner
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit installed dependency vulnerabilities
        run: pip-audit --strict
      - name: Run medium/high severity security scan
        run: bandit -q -r audit-recovery/review-round-2/revisi_audit_final_main.py audit-recovery/review-round-2/clouzer_file_creation.py -ll
      - name: Run GWM scheduler regression tests
        run: python -m unittest discover -s audit-recovery/review-round-2 -p "test_clouzer_workload.py" -v
      - name: Run document file creation tests
        run: python -m unittest discover -s audit-recovery/review-round-2 -p "test_file_creation.py" -v
      - name: Fetch and verify original CLOUZER ZIP fixture
        run: |
          fixture="$RUNNER_TEMP/CLOUZER_paket_tes_manual.zip"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Cluzere/Main-py/main/CLOUZER_paket_tes_manual.zip \
            --output "$fixture"
          echo "9944f200e2c0a2b00286611900a5249a57e6626a86437840e3e10237820c52db  $fixture" | sha256sum --check
          echo "CLOUZER_AUDIT_PACKAGE=$fixture" >> "$GITHUB_ENV"
      - name: Run candidate archive regression tests
        run: python -m unittest discover -s tests -p "test_audit_candidate_*.py" -v
      - name: Run existing audit regression tests when present
        run: |
          if [ -d audit-recovery/review-round-2 ] && ls audit-recovery/review-round-2/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s audit-recovery/review-round-2 -p "test_*.py" -v
          else
            echo "No prior round-2 test modules found; focused candidate tests remain mandatory."
          fi
